<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout concept: a flat field where cards surface from memory and sink back, with plain catalogue pages behind it. */
:root{color-scheme:dark;--ground:#000000;--ground2:#17131f;--ink:#f6f2ff;--dim:#c2b9de;--line:rgba(255,255,255,.24);--gold:#f2c976;--goldfill:#e9c67c;--card:#ffffff;--cardink:#2c1d52;--carddim:#67588a;--book:#f5e8cf;--audio:#dce6fb;--course:#e4d8f8;

body{background:var(--ground)}
#nebula{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#nebula i{position:absolute;display:block;border-radius:50%;will-change:transform,opacity;animation:neb 67s ease-in-out infinite alternate}
#nebula i:nth-child(1){left:8%;top:-4%;width:84%;height:108%;background:radial-gradient(closest-side,rgba(92,40,178,.4),rgba(62,26,128,.16) 60%,transparent);animation-duration:83s}
#nebula i:nth-child(2){left:-22%;top:-26%;width:70%;height:90%;background:radial-gradient(closest-side,rgba(56,34,150,.3),transparent);animation-duration:61s;animation-delay:-20s}
#nebula i:nth-child(3){right:-22%;bottom:-30%;width:76%;height:96%;background:radial-gradient(closest-side,rgba(112,38,160,.28),transparent);animation-duration:97s;animation-delay:-45s}
#nebula i:nth-child(4){right:-10%;top:-24%;width:54%;height:68%;background:radial-gradient(closest-side,rgba(70,30,140,.2),transparent);animation-duration:73s;animation-delay:-10s}
@keyframes neb{from{transform:translate(-5%,-4%) scale(.92);opacity:.72}to{transform:translate(6%,5%) scale(1.14);opacity:1}}
body.field-on header{background:transparent}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font:600 15px/1.5 var(--font)}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
header{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gr) 12px var(--gl);background:var(--ground)}
.brand{font-family:var(--display);font-size:19px;font-weight:600;text-decoration:none;margin-right:auto}
header nav{display:flex;gap:6px 20px;flex-wrap:wrap;max-width:100%;align-items:center}
nav>a,.menu>button{text-decoration:none;color:var(--dim);white-space:nowrap;padding:3px 0;border-bottom:1px solid transparent}
nav>a:hover,.menu>button:hover{color:var(--ink)}nav>a.on,.menu>button.on{color:var(--gold);border-color:var(--gold)}
.menu{position:relative}.menu>button::after{content:"";display:inline-block;width:6px;height:6px;margin:0 2px 3px 7px;border-right:1px solid;border-bottom:1px solid;transform:rotate(45deg)}
.drop{position:absolute;top:100%;right:0;min-width:210px;max-height:62vh;overflow-y:auto;background:var(--ground2);border:1px solid var(--line);border-radius:4px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45);margin-top:6px}
.drop::before{content:""}.drop a{display:block;padding:7px 10px;text-decoration:none;border-radius:3px;white-space:nowrap}.drop a:hover,.drop a:focus-visible{background:var(--ground);color:var(--gold)}
.drop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
@media(max-width:640px){nav{gap:4px 13px;font-size:14px}.menu{position:static}.drop{left:var(--gl);right:var(--gr);top:auto}}
#page{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 92px) var(--gr) 64px var(--gl)}

/* zoom field */

#field{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
#twinkle{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}body:not(.field-on) #twinkle{display:none}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}body:not(.field-on) #sparks{display:none}
#field{pointer-events:none;z-index:4}.fc{pointer-events:auto}
.fc{position:absolute;left:0;top:0;will-change:transform,opacity;text-align:left;transform-origin:center}
.caption{position:fixed;z-index:15;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom,0px));padding-inline:var(--gl) var(--gr);text-align:center;pointer-events:none}
.dock{display:flex;justify-content:center;gap:clamp(14px,3vw,44px);pointer-events:auto}
.dk{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--dim);font-size:14px;font-weight:700;width:clamp(92px,10vw,132px);text-align:center;line-height:1.2;transition:color .3s}

.dk:hover,.dk:focus-visible{color:var(--ink)}
.dk:hover .orb,.dk:focus-visible .orb{transform:translateY(-5px) scale(1.42);box-shadow:0 0 16px rgba(var(--c),.95),0 0 38px 8px rgba(var(--c),.5)}
.dk.em{animation-duration:1.5s;animation-delay:calc(var(--i)*170ms + 1.1s)}
@media(max-width:640px){.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}.dk{width:auto;font-size:13px;gap:5px}.orb{width:24px;height:24px}}

.logo-float{position:relative;z-index:1}

.logo-float.sun img{filter:drop-shadow(0 0 .9px rgba(255,255,255,.95)) drop-shadow(0 0 .5px rgba(255,255,255,.7))}
.tile.lit{position:relative;z-index:0;background:none;box-shadow:none}

.em{animation:emerge 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + .22s)}

.back{display:inline-block;color:var(--dim);text-decoration:none;margin-bottom:10px}.back:hover{color:var(--gold)}
.rows3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px;max-width:720px;margin:0 auto;align-items:start}.rows3.course{max-width:1040px}.rows3 .item{text-align:center}
.info{margin-top:30px;padding:20px 22px;background:var(--ground2);border-radius:4px}.info h2{margin:0 0 12px;font-family:var(--display);font-size:20px;font-weight:600}
.info-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.info h3{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--gold)}.info p{margin:0;color:var(--dim);font-size:15px;max-width:60ch}
@media(max-width:640px){.info-cols{grid-template-columns:1fr}.rows3{gap:18px 12px}.rows3.course{grid-template-columns:repeat(2,minmax(0,1fr))}.rows3 .ph b{font-size:15px}.rows3 .ph{padding:8px}.rows3 .ph span{font-size:9px}}
#outbtn{position:fixed;z-index:15;right:var(--gr);bottom:max(16px,env(safe-area-inset-bottom,0px));padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--ground)}#outbtn:hover{border-color:var(--gold);color:var(--gold)}

/* cards */
.logo-float{display:block}.logo-float img{display:block;width:100%;height:auto}
.tile{display:block;background:var(--card);color:var(--cardink);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden}
.logo-tile{padding:16px 16px 12px;text-align:center}.logo-tile img{display:block;width:100%;aspect-ratio:1.25;object-fit:contain}.logo-tile b{display:block;font-family:var(--display);font-weight:600;margin-top:8px;font-size:clamp(13px,1.2vw,16px);overflow-wrap:anywhere}.logo-tile span{font-size:12px;color:var(--carddim)}
.offer-tile{padding:22px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.offer-tile b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1}.offer-tile span{color:var(--carddim);font-size:13px}
.t-book{background:var(--book)}.t-audio{background:var(--audio)}.t-course{background:var(--course)}
.cover{display:block;position:relative;width:100%;background:var(--card);color:var(--cardink);overflow:hidden;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

.cover.book{aspect-ratio:2/3;background:var(--book)}.cover.audio{aspect-ratio:1;background:var(--audio)}.cover.course{aspect-ratio:16/10;background:var(--course)}
.ph{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.ph b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1}.ph span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--carddim)}

/* catalogue */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--dim)}.chip:hover{color:var(--ink);border-color:var(--ink)}.chip.on{background:var(--goldfill);border-color:var(--goldfill);color:var(--cardink)}
#search{flex:1 1 200px;max-width:280px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}#search::placeholder{color:var(--dim)}
.grid{display:grid;gap:28px 22px;grid-template-columns:repeat(auto-fill,minmax(var(--min,150px),1fr));align-items:start}
.item{display:block;width:100%;text-align:left;min-width:0}.item:hover .cover{transform:translateY(-4px)}.item .cover{transition:transform .25s}
.item strong{display:block;font-weight:700;margin-top:8px}.tag{display:inline-block;font-size:12px;color:var(--gold)}
.empty{color:var(--dim)}
.prongs{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}.prongs a{text-decoration:none;display:block;transition:transform .25s}.prongs a:hover{transform:translateY(-4px)}.prongs .tile{min-height:170px}
.mhead{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-bottom:26px}.mhead .tile{padding:12px;flex:0 0 170px}.mhead img{display:block;width:100%;height:110px;object-fit:contain}.mhead>div{flex:1 1 280px;min-width:0}
@media(max-width:640px){.prongs{grid-template-columns:1fr}.prongs .tile{min-height:110px}}
.models{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.model{background:var(--ground2);padding:16px;border-radius:4px;display:flex;flex-direction:column;gap:10px;min-width:0}.model{background:none!important;padding:0!important}.model .tile,.mhead .tile{background:none;box-shadow:none}.model .tile{padding:0}.model .tile img{display:block;width:100%;height:130px;object-fit:contain}.model h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}.model p{margin:0;color:var(--dim);font-size:14px}.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}.links a:hover{color:var(--gold)}
.about{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:32px;align-items:start}.portrait{aspect-ratio:4/5;background:var(--ground2);display:grid;place-items:center;color:var(--dim);border-radius:4px}.about h2{font-family:var(--display)}.about ul{padding-left:18px;color:var(--dim)}.about p{max-width:62ch}
@media(max-width:640px){.about{grid-template-columns:1fr}.portrait{max-width:200px}.grid{--min:130px!important;gap:22px 14px}}

/* product view */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.93);display:grid;place-items:center;padding:20px var(--gr) 20px var(--gl);overflow:auto;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.sheet{display:grid;grid-template-columns:minmax(0,260px) minmax(0,340px);gap:28px;align-items:center;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:scale(.86);opacity:.2;filter:blur(5px)}}
.sheet h2{font-family:var(--display);font-size:29px;font-weight:600;line-height:1.1;margin:4px 0 10px}.sheet p{color:var(--dim);margin:0 0 14px}
.buy{display:block;text-align:center;padding:11px;border-radius:999px;background:var(--goldfill);color:var(--cardink);text-decoration:none;font-weight:700}.soon{display:block;text-align:center;padding:10px;border-radius:999px;border:1px dashed var(--line);color:var(--dim);font-size:13px}
#closer{display:block;margin-top:14px;color:var(--dim);font-size:13px}#closer:hover{color:var(--gold)}
@media(max-width:640px){.sheet{grid-template-columns:1fr;gap:16px}.sheet .cover{max-width:170px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const $=id=>document.getElementById(id),E=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOCK=[['Continuing Education','https://www.neurocisestudios.com/continuing-education','255,212,40'],['Books','https://www.neurocisestudios.com/books','250,150,40'],['Audios','https://www.neurocisestudios.com/audios','120,205,240'],['Videos','https://www.neurocisestudios.com/video','60,130,230'],['HypnoSonics&trade;','https://www.neurocisestudios.com/hypnosonics','190,90,220'],['NLP Resources','https://www.neurocisestudios.com/nlp-programs','140,205,70']];
const OFFERS=[{key:'books',type:'book',name:'Books'},{key:'audios',type:'audio',name:'Audios'},{key:'courses',type:'course',name:'Courses'}];
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
const modelOf=id=>MODELS.find(m=>m.id===id);
const productsFor=(m,t)=>PRODUCTS.filter(p=>(!m||p.model===m)&&(!t||p.type===t));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function coverHTML(p){const m=modelOf(p.model);
  return `<span class="cover ${p.type}">${p.cover?`<img src="${E(p.cover)}" alt="" loading="lazy">`:`<span class="ph"><span>${E(m?m.name:'')}</span><b>${E(p.title)}</b></span>`}</span>`}

/* ---------- emerging card field ---------- */
const field={cards:[],queue:[],t:0,mx:-1e4,my:-1e4,leaving:null,level:null};
const ease=t=>t*t*(3-2*t);
const SPEC={ // card width in px by level
  model:w=>Math.min(230,Math.max(136,w*.17)),offer:w=>Math.min(300,Math.max(170,w*.23)),
  book:w=>Math.min(170,Math.max(104,w*.125)),audio:w=>Math.min(190,Math.max(116,w*.14)),course:w=>Math.min(270,Math.max(160,w*.2))};
function layout(n,cw,ch){ // jittered grid that fits the screen and leaves room for header and caption
  const W=innerWidth,narrow=W<=640,top=narrow?96:70,bot=narrow?118:70,H=Math.max(200,innerHeight-top-bot);
  const fit=Math.max(1,Math.floor(W*H/((cw+18)*(ch+18)))),k=Math.min(n,fit);
  const cols=Math.max(1,Math.round(Math.sqrt(k*W/H))),rows=Math.ceil(k/cols),s=[];
  for(let i=0;i<k;i++){const r=Math.floor(i/cols),inRow=r===rows-1?k-cols*(rows-1):cols,c=i%cols;
    const cx=(c+.5)/inRow*W,cy=top+(r+.5)/rows*H;
    const jx=(Math.random()-.5)*Math.max(0,W/inRow-cw)*.7,jy=(Math.random()-.5)*Math.max(0,H/rows-ch)*.7;
    s.push({x:Math.max(cw/2+6,Math.min(W-cw/2-6,cx+jx)),y:Math.max(top+ch*.4,Math.min(top+H-ch*.4,cy+jy))})}
  return s;
}
/* The model orbit: upright logos circle slowly on an oval, moving back and forward in depth, inside a fixed space. */
const orbit={on:false,t:0,rot:0};
function orbitBox(){
  const W=innerWidth,top=document.querySelector('header').getBoundingClientRect().bottom+12,bottom=$('cap').getBoundingClientRect().top-12,A=Math.max(160,bottom-top);
  const narrow=W<=640,side=Math.min(W*(narrow?.3:.15),A*.25,215),area=side*side/1.25;
  let maxH=0,maxW=1;
  field.cards.forEach(c=>{const r=c.ratio||1.4;if(c.sun){const w=Math.min(W*(narrow?.5:.33),A*.33*r);c.w=w;c.h=w/r;c.el.style.width=w+'px';return}let w=Math.sqrt(area*r);w=Math.min(w,W*(narrow?.44:.27));c.w=w;c.h=w/r;c.el.style.width=w+'px';maxH=Math.max(maxH,c.h);maxW=Math.max(maxW,w)});
  orbit.box={W,top,bottom:top+A,A,maxH,narrow,maxW};
}
function setOrbit(items){
  const box=$('field');field.leaving=null;box.textContent='';lastSource=null;field.cards=[];
  field.queue=[];field.overflow=false;orbit.on=true;
  let orbitN=0;
  field.cards=items.map((it,i)=>{
    const el=document.createElement('a');el.className='fc';el.href=it.url;box.append(el);
    const c={el,w:100,h:72,ratio:it.ratio,sun:!!it.core,base:(it.core?orbitN:orbitN++)/Math.max(1,items.filter(x=>!x.core).length)*6.2832+(innerWidth<=640?0:.35),off:0,hover:0,born:performance.now()+(REDUCED?0:200+i*90),blur:-1,seed:Math.random()*6.28};
    mountCard(c,it);
    el.onpointerenter=()=>c.over=true;el.onpointerleave=()=>c.over=false;el.onfocus=()=>c.over=true;el.onblur=()=>c.over=false;
    return c});
  orbitBox();
}
function tickOrbit(now,dt){
  orbit.t+=dt;const t=orbit.t,cs=field.cards;if(!cs.length||!orbit.box)return;
  const gust=REDUCED?0:Math.pow(.5+.5*Math.sin(t*.09),3),speed=REDUCED||orbit.box.narrow?0:.05+.025*gust;orbit.rot+=speed*dt;
  const B=orbit.box,S0=.72,S1=1.05,HS=1.18;
  // sized so the largest logo stays inside the space at both the front and back of the oval
  const RY=Math.max(10,(B.A-B.maxH*S1/2-B.maxH*S0/2)/2),cy=B.top+B.maxH*S0/2+RY,cx=B.W/2,RX=Math.min(B.W/2-B.maxW*S1/2-6,B.W*(B.narrow?.34:.37));
  const anyOver=cs.some(c=>c.over);
  cs.forEach(c=>{
    c.hover+=((c.over?1:0)-c.hover)*Math.min(1,dt*4);const h=c.hover;
    if(c.sun){ // the core model holds the center and breathes
      const en=ease(Math.min(1,Math.max(0,(now-c.born)/1200))),s=(1+(REDUCED?0:Math.sin(t*.5)*.012)+h*.05)*(.85+.15*en);
      c.px=cx;c.py=cy;c.s=s;c.o=en;orbit.sun=c;c.el.style.opacity=en.toFixed(3);c.el.style.zIndex=c.over?300:60;
      c.el.style.transform=`translate(${(cx-c.w/2).toFixed(1)}px,${(cy-c.h/2).toFixed(1)}px) scale(${s.toFixed(3)})`;return}

  $('page').innerHTML=`<div class="wrap"><a class="back" href="#models">&lt; All models</a><div class="mhead em"><span class="tile lit"><img src="${E(m.logo)}" alt="${E(m.name)} logo"></span><div>${m.core?'<small style="color:var(--gold);font-weight:800">The core model</small>':''}<h1>${E(m.name)}</h1><p class="lead" style="margin:0">${E(m.description||'Description to come.')}</p></div></div><div class="prongs">${OFFERS.map((o,i)=>`<a class="em" style="--i:${i+1}" href="#zoom-${m.id}-${o.key}"><span class="tile offer-tile t-${o.type}"><b>${o.name}</b><span>${plural(productsFor(m.id,o.type).length,o.type)}</span></span></a>`).join('')}</div><section class="info em" style="--i:5"><h2>About ${E(m.name)}</h2><div class="info-cols">${info.map(([h,v,d])=>`<div><h3>${h}</h3><p>${E(v||d)}</p></div>`).join('')}</div></section></div>`;
}
function productRows(m,o){
  const ps=productsFor(m.id,o.type);
  $('page').innerHTML=`<div class="wrap"><a class="back" href="#model-${m.id}">&lt; ${E(m.name)}</a><h1>${o.name}</h1><p class="lead">${plural(ps.length,o.type)} in ${E(m.name)}.</p><div class="rows3 ${o.type}" id="rows"></div></div>`;
  ps.forEach((p,i)=>{const b=document.createElement('button');b.className='item em';b.style.setProperty('--i',Math.min(i,12));b.innerHTML=`${coverHTML(p)}<strong>${E(p.title)}</strong>`;b.onclick=()=>openSheet(p);$('rows').append(b)});
}
function aboutPage(){
  $('page').innerHTML=`<div class="wrap"><h1>About the author</h1><div class="about"><div class="portrait">Photo to come</div><div><h2 style="font-weight:600;margin:0 0 6px">Elvis Lester</h2><p>Master Trainer and creator of the models in this archive. The full biography goes here.</p><ul><li>Qualified Teacher of Hypnosis</li><li>Qualified Supervisor (LMHC, Florida)</li><li>Advanced Master Trainer</li></ul><p><a href="https://www.neurocisestudios.com/" target="_blank" rel="noopener">Visit Neurocise Studios</a></p></div></div></div>`;
}

/* ---------- menus ---------- */
$('drop-models').innerHTML=MODELS.map(m=>`<a href="${E(m.url)}">${E(m.name)}</a>`).join('');
$('drop-offers').innerHTML=DOCK.map(([n,u])=>`<a href="${u}">${n}</a>`).join('');
function closeMenus(except){document.querySelectorAll('.menu').forEach(M=>{if(M===except)return;M.querySelector('.drop').hidden=true;M.firstElementChild.setAttribute('aria-expanded','false')})}
document.querySelectorAll('.menu').forEach(M=>{const b=M.firstElementChild,d=M.querySelector('.drop');let tm;
  const show=()=>{clearTimeout(tm);closeMenus(M);d.hidden=false;b.setAttribute('aria-expanded','true')};
  let viaHover=false;
  b.onclick=()=>{if(viaHover){viaHover=false;return}d.hidden?show():closeMenus()};
  M.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){viaHover=d.hidden;show()}});
  M.addEventListener('pointerleave',e=>{viaHover=false;if(e.pointerType==='mouse')tm=setTimeout(()=>closeMenus(),260)});
  d.addEventListener('click',e=>{if(e.target.closest('a'))closeMenus()});
});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenus()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});

/* ---------- routing ---------- */
function route(){ // the other pages are tucked away, so every address leads home
  const h=location.hash.slice(1);if(h&&h!=='home'){location.replace('#home');return}
  closeSheet();closeMenus();document.body.classList.add('field-on');sizeSparks();sp.list=[];sp.next=performance.now()+800;$('cap').hidden=false;showHome();scrollTo(0,0);
}
addEventListener('hashchange',route);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(document.body.classList.contains('field-on'))route()},300)});
route();
</script>
